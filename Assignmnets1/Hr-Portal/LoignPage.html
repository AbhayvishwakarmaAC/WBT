<html>
    <head>
        <title>
            Login Page
        </title>
        <link rel="stylesheet" type="text/css" href="style.css">

        <style>
             body{
                background:linear-gradient(black,white);
                display:flex;
                justify-content:center;
                align-items: center;
            }
        </style>
    </head>
    <body class>
        <div class="login">
            <h1>Login Page</h1>
            <input type="text" placeholder="Enter Your User Id" class="username">
            <br>
            <input type="Password" placeholder="Enter Your Password" class="password">
            <br>
            <button class="loginbtn">Log in</button>
            <br>
            <button class="needHelp">Need Help</button>
            <button class="fotgetPass">forget Password</button>
        </div>
    </body>
</html>
