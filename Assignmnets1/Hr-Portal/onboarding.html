<html>
    <head>
        <title>
            Onboarding Page
        </title>
         <link rel="stylesheet" type="text/css" href="style.css">
         <style>
             body{
              background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                      url("Onboarding.png");
            }
         </style>
    </head>
    <body class="onboardingBody">
        <h1 align="center" style="color:yellow"> OnBoarding Form</h1>
        <div class="Onboard">
        <table>
            <tr>
                <td>Full Name</td>
                <td><input type="text" placeholder="Enter your Name"></td>
            </tr>
            <tr>
                <td>Official email</td>
                <td><input type="email" placeholder="Enter your Email"></td>
            </tr>
            <tr>
                <td>Temporary password</td>
                <td><input type="Password" placeholder="Enter your Password"></td>
            </tr>
            <tr>
                <td>Date of birth </td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Joining date</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Orientation slot</td>
                <td><input type="datetime-local"></td>
            </tr>
            <tr>
                <td>Reporting time on day one</td>
                <td><input type="time" placeholder="Enter your Name"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <label>Male</label>
                    <input type="Radio" name="gender">
                    <label>Female</label>
                    <input type="Radio" name="gender">
                    <label>Prefer Not to Say</label>
                    <input type="Radio" name="gender">
                    
                </td>
            </tr>
            <tr>
                <td>Highest qualification</td>
                <td>
                    <label>10th</label>
                    <input type="radio">
                    <label>12th</label>
                    <input type="radio">
                    <label>Btech</label>
                    <input type="radio">
                    <label>BCA</label>
                    <input type="radio">
                    <label>MCA</label>
                    <input type="radio">
                </td>
            </tr>
            <tr>
                <td>Department </td>
                <td>
                    <label>Instrumnetation</label>
                    <input type="radio" name="dept">
                    <label>CS</label>
                    <input type="radio" name="dept">
                    <label>IT</label>
                    <input type="radio" name="dept">
                    <label>EXTC</label>
                    <input type="radio" name="dept">
                </td>
            </tr>
            <tr>
                <td>Current Address</td>
                <td><input type="textarea" placeholder="Enter your Address"></td>
            </tr>
            <tr>
                <td>Passport photo or resume</td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td>I Accept the Term and Conditions</td>
                <td><input type="checkbox"></td>
            </tr>
        </table>
     </div>

     <div class="button">
        <button>Submit</button>
     </div>

    </body>
</html>
